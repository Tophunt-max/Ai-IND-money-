[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skopaqtrader"
version = "0.2.0"
description = "Adaptive-AI algorithmic trading platform for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Market-data layer (tradingagents/dataflows) ---
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
    # --- Skopaq additions ---
    "redis>=6.2.0",
    "httpx>=0.28.0",
    "websockets>=13.0",
    "pydantic>=2.13",  # cp314 wheels, no Pydantic-V1 warning on 3.14
    "pydantic-settings>=2.6.0",
    "cryptography>=44.0.0",
    "apscheduler>=3.10.0",
    "supabase>=2.11.0",
    "upstash-redis>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.2,<2",  # skopaq/mcp_server.py; 2.x drops mcp.server.FastMCP
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "python-telegram-bot>=22.4",  # tests/unit/test_telegram_bot.py
]
# Optional learning candidates and search (skopaq learn-train / adaptive-train --model
# lightgbm|xgboost|catboost, skopaq hyperopt). Without them the logistic baseline is used
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "scikit-learn>=1.4",  # random_forest / extra_trees models, SVM / DBSCAN outliers
]
# Neural models (adaptive-train --model mlp | ft_transformer); CPU wheels:
# pip install torch --index-url https://download.pytorch.org/whl/cpu
torch = [
    "torch>=2.2",
    "safetensors>=0.4",
]
# Runtime integrations installed in the Docker image (Dockerfile) and into the Mac host's
# MCP Python (docs/deployment/mac-mini.md). redis is already a core dependency.
deploy = [
    "python-telegram-bot[job-queue]>=22.4,<23",  # 22.4+: run_polling works on Python 3.14; job-queue pins APScheduler<3.12
    "psycopg2-binary>=2.9.11",  # first release with cp314 wheels
    "quantstats>=0.0.80",
]

[project.scripts]
skopaq = "skopaq.cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "skopaq*"]

[tool.setuptools.package-data]
"skopaq.cli" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
